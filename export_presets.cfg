[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray()
include_filter="data/*.json,assets/graphics/*.json,assets/online/*.json"
exclude_filter="tests/*,docs/*,tools/*,.tools/*,output/*,builds/*,supabase/*"
export_path="builds/windows/GemTD.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=".tools/templates/windows_debug_x86_64.exe"
custom_template/release=".tools/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
texture_format/s3tc_bptc=true

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray()
include_filter="data/*.json,assets/graphics/*.json,assets/online/*.json"
exclude_filter="tests/*,docs/*,tools/*,.tools/*,output/*,builds/*,supabase/*"
export_path="builds/web/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug=".tools/templates/web_nothreads_debug.zip"
custom_template/release=".tools/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
html/head_include="<meta name='description' content='GemTD Solo — a 100-wave solo tower defense web beta.'><link rel='icon' href='data:,'>"
